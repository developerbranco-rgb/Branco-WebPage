<footer class="footer">
      <div class="wrap">
        <div class="footer__top">
          <a href="index.html" class="footer__brand" aria-label="Branco — Inicio">
            <img src="assets/logos/branco.webp" alt="Branco" width="120" height="120" loading="lazy" />
          </a>
          <div class="footer__navs">
            <nav class="footer__links" aria-label="Videos">
              {{FOOTER_LINKS}}
            </nav>
            <nav class="footer__links footer__links--props" aria-label="Propuestas">
              {{FOOTER_PROPUESTAS}}
            </nav>
          </div>
          <div class="footer__soc">
            <a data-wa href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" /></svg>
            </a>
            <a data-ig href="#" target="_blank" rel="noopener" aria-label="Instagram">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" /><circle cx="12" cy="12" r="4" /><path d="M17.5 6.5h.01" /></svg>
            </a>
            <a data-mail href="#" aria-label="Email">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-10 5L2 7" /></svg>
            </a>
          </div>
        </div>
        <div class="footer__bottom">
          <span>© <span data-year></span> Branco · Saxofonista</span>
          <span>Show de saxo en vivo para bares, eventos, empresas y festivales</span>
        </div>
      </div>
    </footer>

    <a class="wa-float" data-wa href="#" target="_blank" rel="noopener" aria-label="Escribime por WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2z" /></svg>
    </a>

    <!-- Reproductor de videos -->
    <div class="player" id="player" role="dialog" aria-modal="true" aria-label="Reproductor de video" hidden>
      <div class="player__top">
        <p class="player__title" id="playerTitle"></p>
        <span class="player__count" id="playerCount"></span>
        <button class="player__nav player__nav--prev" id="playerPrev" type="button" aria-label="Video anterior">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" /></svg>
        </button>
        <button class="player__nav player__nav--next" id="playerNext" type="button" aria-label="Video siguiente">
          <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg>
        </button>
        <button class="player__close" id="playerClose" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="player__stage" id="playerStage">
        <video id="playerVideo" controls playsinline preload="auto"></video>
      </div>
    </div>

    <!-- Fotos ampliadas -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
      <button class="lightbox__close" id="lbClose" aria-label="Cerrar">&times;</button>
      <img alt="" id="lbImg" />
    </div>
